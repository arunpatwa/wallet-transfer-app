# Render blueprint. Deploys the Docker image built from this repository -- not a
# buildpack -- so the artefact that runs in production is the same one that runs
# locally under docker compose.

services:
  - type: web
    name: wallet-transfer-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore

    # Ship every push to main. Stated explicitly rather than relying on the
    # platform default, so the deployed revision is always the one in the
    # repository -- a blueprint service that silently stops tracking main is a
    # deployment that quietly drifts from the code being reviewed.
    autoDeploy: true

    # Liveness, not readiness. If this pointed at /readyz, a database outage
    # would fail the health check and Render would restart the service into a
    # crash loop -- while the correct behaviour during a database outage is to
    # stay up, refuse writes with 503, and report /readyz honestly.
    healthCheckPath: /healthz

    envVars:
      # Supplied in the dashboard, never committed. Must be the Supabase
      # CONNECTION POOLER url: the free tier has no IPv4 address on the direct
      # connection, and Render's egress is IPv4.
      - key: DATABASE_URL
        sync: false

      # Generated by Render on first deploy and never visible in the repository.
      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_SSL
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: '10'

      # Demo endpoints, enabled so the correctness gate is runnable against the
      # live URL with one command.
      - key: DEV_TOKEN_ENABLED
        value: 'true'
      - key: FAUCET_ENABLED
        value: 'true'
      - key: FAUCET_MAX_PAISE
        value: '10000000'
